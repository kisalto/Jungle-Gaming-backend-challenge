version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: jungle_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d wager_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: